name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消在途旧跑（push+PR 双触发不再双倍计费）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 类型检查与 lint 是纯 JS 工具链，放 ubuntu 快跑省时省费；
  # --ignore-scripts 跳过 electron 下载与图标生成（静态检查不需要）
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  verify:
    runs-on: windows-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      # 覆盖率门禁（OPT-50）：阈值在 vitest.config.ts（语句 80 / 分支 65 起步），
      # 低于阈值即失败，防止分支覆盖无感下滑
      - name: Coverage gate
        run: node scripts/run-vitest.mjs --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: UI smoke test
        shell: pwsh
        run: |
          node scripts/gen-testdata.mjs 300
          $env:FRAMORA_USER_DATA = Join-Path $env:RUNNER_TEMP 'framora-ui-test-data'
          $proc = Start-Process -FilePath "$PWD\node_modules\.bin\electron.cmd" `
            -ArgumentList '.', '--remote-debugging-port=9222' -PassThru
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { Invoke-RestMethod 'http://127.0.0.1:9222/json/version' | Out-Null; $ready = $true; break } catch {}
          }
          if (-not $ready) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Error 'Electron CDP 端口未就绪'
            exit 1
          }
          node scripts/ui-test.mjs 9222
          $code = $LASTEXITCODE
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          exit $code

      # 冒烟失败取证：截图落在系统临时目录（framora-ui-test），上传为 artifact 便于排查
      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-failure
          path: ${{ runner.temp }}/framora-ui-test/
          if-no-files-found: ignore
