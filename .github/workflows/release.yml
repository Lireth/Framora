name: Release

on:
  push:
    tags: ['v*']
  # 发布演练（OPT-26）：手动触发 drill-dist，跑通「构建 → 产物校验 → 上传」
  # 全链路但不创建 Release——让发布流程从「写完即视为正确」变成随时可验证
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dist:
    if: github.event_name == 'push'
    runs-on: windows-latest
    # 与 drill-dist 对齐的超时上限（此前缺失，挂起最长等待 6h）；
    # 并发组保证短间隔推多个标签时串行构建，避免并行任务竞争同一 Release
    timeout-minutes: 40
    concurrency:
      group: release-dist-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 闸门 1（fail fast）：标签必须与 package.json 版本一致。安装包版本取自构建期
      # package.json，而应用内更新器比较的是 latest.yml 版本与已装版本——若直接推
      # v1.0.x 标签而未提升版本号，产物将永远携带 1.0.0，更新检测静默失效
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::标签 $TAG 与 package.json version ($PKG_VERSION) 不一致，拒绝构建"
            echo "修复：将 package.json 的 version 更新为 $TAG_VERSION 并提交，然后重打标签（git tag -f $TAG && git push -f origin $TAG）"
            exit 1
          fi
          echo "版本校验通过：$TAG = package.json@$PKG_VERSION"
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build installer
        run: npm run dist

      # 闸门 2：构建产物是更新器的实际数据源（latest.yml 的 version 决定应用内能否
      # 检测到新版），发布前验证产物版本与安装包名与标签一致
      - name: Verify build artifacts match tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BUILT=$(node -e 'const s=require("fs").readFileSync("release/latest.yml","utf8");const m=/^version:\s*(.+)$/m.exec(s);if(!m){console.error("latest.yml 缺少 version 字段");process.exit(1)}console.log(m[1].trim())')
          TAG_VERSION="${TAG#v}"
          if [ "$BUILT" != "$TAG_VERSION" ]; then
            echo "::error::构建产物 latest.yml 版本 ($BUILT) 与标签 ($TAG_VERSION) 不一致"
            exit 1
          fi
          if [ ! -f "release/Framora-$TAG_VERSION-setup.exe" ]; then
            echo "::error::安装包 Framora-$TAG_VERSION-setup.exe 不存在"
            exit 1
          fi
          echo "产物校验通过：Framora-$TAG_VERSION-setup.exe（latest.yml version=$BUILT）"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

  # 发布演练：与 dist 相同的构建与产物校验，但以 package.json 版本为基准，
  # 产物上传为 workflow artifact（保留 7 天）而非 GitHub Release
  drill-dist:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build installer
        run: npm run dist

      - name: Verify build artifacts match package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          BUILT=$(node -e 'const s=require("fs").readFileSync("release/latest.yml","utf8");const m=/^version:\s*(.+)$/m.exec(s);if(!m){console.error("latest.yml 缺少 version 字段");process.exit(1)}console.log(m[1].trim())')
          if [ "$BUILT" != "$PKG_VERSION" ]; then
            echo "::error::构建产物 latest.yml 版本 ($BUILT) 与 package.json ($PKG_VERSION) 不一致"
            exit 1
          fi
          if [ ! -f "release/Framora-$PKG_VERSION-setup.exe" ]; then
            echo "::error::安装包 Framora-$PKG_VERSION-setup.exe 不存在"
            exit 1
          fi
          echo "演练校验通过：Framora-$PKG_VERSION-setup.exe（latest.yml version=$BUILT）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: framora-dist-drill
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          retention-days: 7
          if-no-files-found: error
